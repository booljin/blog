<article style="background-color: #FFFFFF;" class="rounded-xl p-4 w-full mb-6">
    <!-- 如果有图，采用左图右标题布局 -->
    {{ if .Params.image }}
    <!-- 使用纯原生 CSS 强制横向排列、居中对齐、24px 间距 -->
    <div style="display: flex; align-items: center; gap: 1.5rem; margin-bottom: 0.75rem;">
        <!-- 核心改动：固定 100x100，强制 object-fit: cover，并从正中心开始裁剪！ -->
        <img src="{{ .Params.image }}" alt="{{ .Title }}" 
             style="width: 100px; height: 100px; object-fit: cover; object-position: center; flex-shrink: 0; display: block; border-radius: 0.375rem; background-color: #f8fafc;">
        
        <!-- 核心改动：强制 border-bottom: 0 !important; 彻底消掉标题下细横线 -->
        <h3 style="flex: 1; min-width: 0; font-size: 1.25rem; font-weight: bold; line-height: 1.25; border-bottom: 0 !important;">
            <a href="{{ .RelPermalink }}" class="hover:underline decoration-primary-500">{{ .Title }}</a>
        </h3>
    </div>
    {{ else }}
        <!-- 无图时同样强制去掉下划线 -->
        <h3 style="font-size: 1.25rem; font-weight: bold; margin-bottom: 0.75rem; border-bottom: 0 !important;">
            <a href="{{ .RelPermalink }}" class="hover:underline decoration-primary-500">{{ .Title }}</a>
        </h3>
    {{ end }}

    <!-- 白色便签纸内部：标题下方的灰色分割线 -->
    <hr class="my-3 border-[#e5e7eb]">

    <!-- 摘要正文 -->
    <div class="text-sm text-[#4b5563] leading-relaxed">
        {{ .Summary }}
    </div>
</article>
