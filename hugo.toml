baseURL = 'https://booljin.github.io/blog/'
locale = 'zh-cn'
title = 'Bool的博客'
theme = 'congo'
defaultContentLanguage = 'zh-cn'

[pagination]
pagerSize = 10

[outputs]
home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.attributes]
        enabled = true

[params]
  # 全局开启卡片视图（对所有列表页有效，包括分类和标签）
  [params.list]
    cardView = true

mainSections = ["posts"]